<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom for Zahra 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(180deg,#fff7fb,#f2fff8);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  height:100vh;
}

h1{
  font-family:'Playfair Display',serif;
  margin:20px 0 5px;
  font-size:2rem;
  color:#332;
}

.sub{
  font-size:0.9rem;
  color:#665;
  margin-bottom:15px;
}

#bouquetArea{
  position:relative;
  width:520px;
  height:470px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  overflow:hidden;
}

#bouquet{
  position:absolute;
  bottom:100px;
  width:380px;
  height:260px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
}

.flower{
  position:absolute;
  font-size:80px;
  transition:all 0.4s cubic-bezier(.2,.9,.2,1);
  animation:popIn 0.4s ease;
  user-select:none;
  pointer-events:auto;
}

@keyframes popIn{
  from{opacity:0; transform:scale(0.4)}
  to{opacity:1; transform:scale(1)}
}

#vase{
  width:180px;
  height:130px;
  border-radius:0 0 90px 90px;
  background:linear-gradient(180deg,#ffe4f0,#ffcde4);
  position:absolute;
  bottom:0;
  box-shadow:0 10px 30px rgba(255,105,160,0.15);
}

.controls{
  display:flex;
  gap:12px;
  margin-top:15px;
}

.pick{
  width:55px;
  height:55px;
  cursor:pointer;
  border-radius:12px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 15px rgba(0,0,0,0.08);
  transition:0.2s;
  font-size:28px;
}
.pick:hover{transform:scale(1.1)}

button{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  border-radius:18px;
  font-weight:600;
  font-size:1rem;
  transition:0.3s ease;
}

#bloomBtn{
  background:linear-gradient(90deg,#ff6fa5,#ff9ec6);
  color:white;
  box-shadow:0 8px 20px rgba(255,105,160,0.25);
  cursor:pointer;
}

#bloomBtn:disabled{
  background:#ccc;
  box-shadow:none;
  cursor:not-allowed;
}

#messageBox{
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:25px 35px;
  border-radius:20px;
  box-shadow:0 20px 50px rgba(0,0,0,0.15);
  font-family:'Playfair Display';
  font-size:1.3rem;
  text-align:center;
  display:none;
  opacity:0;
  transition:opacity 0.6s ease;
  max-width:80%;
  z-index: 100;
}

.burstFlower{
  position:absolute;
  font-size:40px;
  pointer-events:none;
  animation:explode 1.4s ease-out forwards;
}

@keyframes explode{
  0%{opacity:1;transform:scale(0.4)}
  100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.2)}
}
</style>
</head>
<body>

<h1>As far back as i remember it's been 820 days since i started loving you.</h1>

<div id="bouquetArea">
  <div id="bouquet"></div>
  <div id="vase"></div>
</div>

<div class="controls">
  <div class="pick" onclick="addFlower('🌹')">🌹</div>
  <div class="pick" onclick="addFlower('🌷')">🌷</div>
  <div class="pick" onclick="addFlower('🌼')">🌼</div>
  <div class="pick" onclick="addFlower('🌸')">🌸</div>
  <div class="pick" onclick="addFlower('🌻')">🌻</div>
</div>

<button id="bloomBtn" onclick="bloom()" disabled>Bloom 🌸</button>

<div id="messageBox"></div>

<script>
const bouquet = document.getElementById("bouquet");
const bloomBtn = document.getElementById("bloomBtn");
const messageBox = document.getElementById("messageBox");

/*
  Messages are stored as JSON below. 
  You can edit/add lines inside the "messages" array.
*/
const messagesJSON = `{
  "messages": [
"As far back as i remember it's been 820 days since i started loving you.",
"If I had to choose again- I would still choose u every time.",
"You walked into my life and somehow made everything brighter.",
"You are my calm in chaos and smile in silence.",
"With you even ordinary moments feel magical.",
"Every love song makes sense because of you.",
"You are my special loved one.", 
"I could never think of anyone else but you.", 
"I can't imagine a future where you don't exist."
"You are my angel.",
  ]
}`;

let messages;
try {
  const parsed = JSON.parse(messagesJSON);
  messages = Array.isArray(parsed.messages) ? parsed.messages : [];
} catch (e) {
  console.error("Failed to parse messages JSON:", e);
  messages = [
    "If I had to choose again- I would still choose u every time.",
"You walked into my life and somehow made everything brighter.",
"You are my calm in chaos and smile in silence."
  ];
}

function addFlower(emoji){
  const count = bouquet.children.length;
  if(count >= 20) return;

  const flower = document.createElement("div");
  flower.className = "flower";
  flower.innerHTML = emoji;
  // append first so offset sizes are measurable
  bouquet.appendChild(flower);

  // We'll constrain flowers to appear inside the visible bounds of #bouquet
  const bw = bouquet.clientWidth;   // 380 (CSS)
  const bh = bouquet.clientHeight;  // 260 (CSS)
  const fw = flower.offsetWidth || 60;
  const fh = flower.offsetHeight || 60;
  const padding = 8;

  // x between padding and bw - fw - padding
  const x = Math.random() * (Math.max(0, bw - fw - padding*2)) + padding;
  // bottom between padding and bh - fh - padding (so they stay nicely inside the bouquet)
  const bottom = Math.random() * (Math.max(0, bh - fh - padding*2)) + padding;

  // position flower inside the bouquet element
  flower.style.left = x + "px";
  flower.style.bottom = bottom + "px";
  flower.style.zIndex = count;

  // enable bloom button when there are at least 10 flowers
  if(bouquet.children.length >= 10){
    bloomBtn.disabled = false;
  }
}

function bloom(){
  if(bouquet.children.length < 10) return;

  messageBox.style.display = "none";
  messageBox.style.opacity = 0;

  for(let i=0;i<40;i++){
    const bf = document.createElement("div");
    bf.className="burstFlower";
    bf.innerHTML="🌸";
    // position explosion around the midpoint of the bouquetArea
    bf.style.left = (window.innerWidth/2) + "px";
    bf.style.top = (window.innerHeight/2 - 40) + "px";
    bf.style.setProperty("--x",(Math.random()*700-350)+"px");
    bf.style.setProperty("--y",(Math.random()*500-250)+"px");
    document.body.appendChild(bf);
    setTimeout(()=>bf.remove(),1400);
  }

  const randomMessage = messages[Math.floor(Math.random()*messages.length)];
  messageBox.innerHTML = randomMessage;
  messageBox.style.display = "block";

  setTimeout(()=>{
    messageBox.style.opacity = 1;
  },100);
}
</script>

</body>
</html>
